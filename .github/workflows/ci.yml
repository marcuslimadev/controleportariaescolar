name: CI Porta Aberta Escolar

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo, pdo_mysql, fileinfo
          coverage: none

      - name: Validate PHP and JSON
        run: php scripts/ci_check.php
