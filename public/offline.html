<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1356A2">
  <title>Sem conexão · Porta Aberta Escolar</title>
  <style>
    :root{color-scheme:light;--blue:#1356A2;--ink:#171A1F;--muted:#68717D;--border:#DED8C8}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:linear-gradient(145deg,#F7F4EC,#EAF2FB);color:var(--ink)}
    main{width:min(100%,520px);padding:28px;border:1px solid var(--border);border-radius:28px;background:#fffffff2;box-shadow:0 24px 64px #15171A18;text-align:center}
    img{width:88px;height:88px;object-fit:contain;border-radius:24px;background:#fff;border:1px solid var(--border);padding:8px;box-shadow:0 12px 30px #1356A218}
    span{display:inline-flex;margin-top:18px;color:var(--blue);font-size:.78rem;font-weight:950;letter-spacing:.12em;text-transform:uppercase}
    h1{margin:8px 0 10px;font-size:clamp(1.8rem,8vw,2.4rem);line-height:1;font-weight:950;letter-spacing:-.07em}
    p{margin:0;color:var(--muted);font-size:1.05rem;line-height:1.5}
    button{margin-top:24px;width:100%;min-height:52px;border:0;border-radius:999px;background:linear-gradient(135deg,var(--blue),#32A9FF);color:#fff;font-size:1rem;font-weight:900;box-shadow:0 14px 28px #1356A226}
    small{display:block;margin-top:14px;color:var(--muted);font-weight:700}
  </style>
</head>
<body>
  <main>
    <img src="./assets/porta-aberta-app-v2-192.png" alt="">
    <span>Modo offline</span>
    <h1>Sem conexão</h1>
    <p>Você está sem internet agora. Na portaria, registros pendentes ficam salvos no aparelho e sincronizam quando a conexão voltar.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
    <small>Porta Aberta Escolar</small>
  </main>
</body>
</html>
